name: Dart

# Flutter-migration CI. Runs only on the branch; the Python workflow is untouched.
# The owner has limited CI minutes, so always verify locally first and don't
# use CI as a test runner. Toolchain is pinned to Flutter 3.44.8.
on:
  push:
    branches:
      - flutter-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dart:
    name: Analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Resolve workspace dependencies
        run: dart pub get --enforce-lockfile

      - name: Analyze
        run: dart analyze

      - name: Test core
        run: dart test
        working-directory: packages/strakalari_core

      - name: Test app
        run: flutter test
        working-directory: app
