<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Simple flat tray icon: magpie bust on an orange disc, holding the grade tag.
       No gradients or filters so it stays readable at 16x16; the disc keeps it
       visible on both dark and light taskbars. -->
  <defs>
    <clipPath id="disc"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#ffa23a"/>
  <g clip-path="url(#disc)">
    <!-- head + neck -->
    <path d="M 26 22 C 26 14 31 10 37 10 C 44 10 48 15 49 21 C 50 28 54 34 64 40 L 64 64 L 26 64 C 25 54 24 44 25 36 C 25 31 26 27 26 22 Z" fill="#111114"/>
    <!-- white shoulder patch -->
    <path d="M 41 42 C 47 37 56 38 64 42 L 64 48 C 56 47 48 47 42 46 Z" fill="#f4f4f2"/>
    <!-- iridescent wing -->
    <path d="M 42 46 C 50 47 57 48 64 49 L 64 56 C 58 54 51 52 46 51 Z" fill="#2a6f8a"/>
    <!-- white belly -->
    <path d="M 29 64 C 31 57 37 52 46 51 C 52 52 58 55 64 58 L 64 64 Z" fill="#f4f4f2"/>
  </g>
  <!-- eye -->
  <circle cx="39" cy="18" r="2.4" fill="#ffffff"/>
  <!-- beak -->
  <path d="M 28 16.5 C 21 17 14 19.5 6 23.5 C 13 24.5 20 25 28 26 Z" fill="#2c2d32"/>
  <!-- string -->
  <path d="M 12.5 24 L 13 34 M 16.5 24.5 L 15.5 34" stroke="#c9a467" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- grade tag with a red 1 -->
  <g transform="rotate(-7 14 45)">
    <rect x="5" y="34" width="18" height="22" rx="2" fill="#fbf8ef" stroke="#8a826c" stroke-width="1.2"/>
    <path d="M 11 41 L 15 37.5 L 15 51 M 11.5 51 L 18.5 51" stroke="#d01f1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
