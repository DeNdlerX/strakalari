<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- High-contrast monochrome tray variant of the Strakalari logo.
       Flat white hexagon with a black casing edge (readable on both dark
       and light taskbars); fork + pencil reduced to bold solid glyphs so
       the mark survives 16x16. No gradients, no filters, no ink effect. -->
  <g id="hexagon">
    <polygon points="256,256 56.8,141 256,26" fill="#FFFFFF"/>
    <polygon points="256,256 256,26 455.2,141" fill="#FFFFFF"/>
    <polygon points="256,256 455.2,141 455.2,371" fill="#FFFFFF"/>
    <polygon points="256,256 455.2,371 256,486" fill="#FFFFFF"/>
    <polygon points="256,256 256,486 56.8,371" fill="#FFFFFF"/>
    <polygon points="256,256 56.8,371 56.8,141" fill="#FFFFFF"/>
    <polygon points="256,26 455.2,141 455.2,371 256,486 56.8,371 56.8,141"
           fill="none" stroke="#111111" stroke-width="28" stroke-linejoin="round"/>
  </g>

  <g id="symbols" fill="#111111">
    <!-- Simplified bold fork (left) -->
    <rect x="168" y="135" width="18" height="72" rx="9"/>
    <rect x="196" y="135" width="18" height="72" rx="9"/>
    <rect x="224" y="135" width="18" height="72" rx="9"/>
    <rect x="166" y="198" width="78" height="34" rx="10"/>
    <rect x="184" y="228" width="44" height="168" rx="12"/>
    <!-- Simplified bold pencil (right) -->
    <rect x="282" y="112" width="52" height="26" rx="8"/>
    <rect x="280" y="142" width="56" height="198"/>
    <polygon points="280,340 336,340 308,415"/>
  </g>
</svg>
