group 'io.github.dendlerx.strakalari.android'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'io.github.dendlerx.strakalari.android'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
        // Applied to the app's R8 run: keeps what Python looks up by name.
        consumerProguardFiles 'consumer-rules.pro'
    }
}
