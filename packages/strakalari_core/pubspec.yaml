name: strakalari_core
description: Pure-Dart core of Strakalari (no Flutter import). Behavior parity with strakalari/core.
version: 0.1.0

environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  # Phase 1+ dependencies from PLAN §3.3 (http, cookie_jar, html, clock, ...).
  # http + cookie_jar arrive with the client ports (phase 2).
  clock: ^1.1.0
  crypto: ^3.0.0
  html_unescape: ^2.0.0
  path: ^1.9.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
